name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate github-user-contribution.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: HiiGER
          outputs: |
            dist/github-user-contribution.svg
            dist/github-user-contribution-dark.svg?palette=github-dark
            dist/github-user-contribution-catppuccin.svg?color_snake=#b4befe&color_dots=#1e1e2e,#181825,#313244,#45475a,#585b70

      - name: push github-user-contribution.svg to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
